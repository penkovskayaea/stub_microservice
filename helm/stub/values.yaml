name: stub
replicaCount: 1

image:
  repository: your-registry/stub       # замените на реальный репозиторий
  pullPolicy: IfNotPresent
  tag: "1.0.0"

updateStrategy:
  type: RollingUpdate

service:
  type: ClusterIP
  port: 8080
  # actuatorPort: 8081   # при необходимости раскомментировать

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: stub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 5

env:
  - name: STUB_CONFIG_FILE
    value: /app/config/config.yml

# ----- Конфигурация правил stub -----
config:
  rules:
    - path: /health
      method: GET
      response:
        status: 200
      delay: 0